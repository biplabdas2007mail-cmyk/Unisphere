<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" width="100%" height="100%">
  <defs>
    <!-- U-Swoosh Gradient -->
    <linearGradient id="uSwooshGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="45%" stop-color="#0ea5e9" />
      <stop offset="70%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Globe Gradient -->
    <radialGradient id="globeGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </radialGradient>

    <!-- Robot Metallic Head Gradient -->
    <linearGradient id="robotHeadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>

    <!-- Robot Ear/Cap Shadow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0284c7" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Left: Mascot & Globe Emblem Group -->
  <g transform="translate(10, 10)">
    
    <!-- Outer Dynamic U-Shape Swoosh -->
    <!-- Sweeps under the robot from bottom left, swooping up to the right into the orange wing -->
    <path d="M 40 115 
             C 40 165, 80 190, 130 190 
             C 175 190, 205 160, 205 110 
             L 205 92 
             C 205 85, 195 82, 190 88 
             C 182 100, 175 130, 155 150 
             C 135 168, 100 168, 78 145 
             C 65 132, 60 115, 60 95 
             Z" 
          fill="url(#uSwooshGrad)" />

    <!-- Orange Right Wing Accents -->
    <path d="M 175 92 
             C 188 78, 205 82, 205 92
             C 205 125, 185 155, 150 172
             C 172 155, 185 130, 185 105
             C 185 96, 180 92, 175 92 Z" 
          fill="#f97316" />

    <!-- Globe Sphere -->
    <g transform="translate(95, 75)">
      <!-- Base Sphere -->
      <circle cx="50" cy="50" r="45" fill="url(#globeGrad)" />
      
      <!-- Globe Clip Path for Grid Lines -->
      <clipPath id="globeClip">
        <circle cx="50" cy="50" r="45" />
      </clipPath>

      <g clip-path="url(#globeClip)" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.85">
        <!-- Latitude Lines -->
        <line x1="5" y1="50" x2="95" y2="50" stroke-width="3" />
        <ellipse cx="50" cy="30" rx="42" ry="12" />
        <ellipse cx="50" cy="70" rx="42" ry="12" />
        <ellipse cx="50" cy="15" rx="32" ry="7" />
        <ellipse cx="50" cy="85" rx="32" ry="7" />

        <!-- Longitude Lines -->
        <line x1="50" y1="5" x2="50" y2="95" stroke-width="3" />
        <ellipse cx="50" cy="50" rx="26" ry="45" />
        <ellipse cx="50" cy="50" rx="14" ry="45" />
      </g>

      <!-- Globe Shine highlight -->
      <ellipse cx="38" cy="28" rx="20" ry="12" fill="#ffffff" opacity="0.25" transform="rotate(-25 38 28)" />
    </g>

    <!-- Robot Mascot (Front Left) -->
    <g transform="translate(15, 20)" filter="url(#softGlow)">
      
      <!-- Left Robotic Arm -->
      <path d="M 28 92 C 18 95, 12 110, 20 120 C 26 128, 35 125, 40 115 Z" fill="#ffffff" stroke="#0284c7" stroke-width="2.5" stroke-linejoin="round" />
      
      <!-- Right Robotic Arm (Reaching towards globe) -->
      <path d="M 75 95 C 85 95, 95 102, 92 112 C 89 120, 80 122, 72 116 Z" fill="#ffffff" stroke="#0284c7" stroke-width="2.5" stroke-linejoin="round" />

      <!-- Robot Torso -->
      <path d="M 32 85 C 32 80, 72 80, 72 85 L 68 115 C 68 126, 36 126, 36 115 Z" fill="url(#robotHeadGrad)" stroke="#0284c7" stroke-width="2.5" />
      <!-- Torso Core Indicator -->
      <circle cx="52" cy="100" r="6" fill="#0284c7" />
      <circle cx="52" cy="100" r="3" fill="#38bdf8" />

      <!-- Ear Pods / Nodes -->
      <!-- Left Ear -->
      <rect x="14" y="48" width="8" height="18" rx="4" fill="#0284c7" />
      <rect x="16" y="52" width="4" height="10" rx="2" fill="#38bdf8" />
      <!-- Right Ear -->
      <rect x="82" y="48" width="8" height="18" rx="4" fill="#0284c7" />
      <rect x="84" y="52" width="4" height="10" rx="2" fill="#38bdf8" />

      <!-- Head Base (Pill Capsule) -->
      <rect x="20" y="32" width="64" height="52" rx="26" fill="url(#robotHeadGrad)" stroke="#0284c7" stroke-width="3" />

      <!-- Visor / Face Screen Outline -->
      <rect x="27" y="40" width="50" height="36" rx="16" fill="#ffffff" stroke="#0284c7" stroke-width="2" />

      <!-- Friendly Eyes (Blue Glow with highlights) -->
      <ellipse cx="42" cy="54" rx="4.5" ry="6" fill="#0284c7" />
      <circle cx="43.5" cy="52" r="1.5" fill="#ffffff" />

      <ellipse cx="62" cy="54" rx="4.5" ry="6" fill="#0284c7" />
      <circle cx="63.5" cy="52" r="1.5" fill="#ffffff" />

      <!-- Smiling Mouth -->
      <path d="M 45 64 Q 52 70 59 64" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" />

      <!-- Mortarboard / Graduation Cap -->
      <!-- Cap Base Band -->
      <ellipse cx="52" cy="34" rx="22" ry="5" fill="#0c1d36" />
      
      <!-- Diamond Top -->
      <polygon points="52,10 92,26 52,36 12,26" fill="#0f2b48" stroke="#0369a1" stroke-width="1.5" />
      
      <!-- Top Center Button -->
      <circle cx="52" cy="23" r="3" fill="#f59e0b" />
      
      <!-- Cap Tassel (Swinging to the left) -->
      <path d="M 52 23 C 35 25, 20 32, 17 48" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round" />
      <!-- Tassel Pompom End -->
      <ellipse cx="17" cy="52" rx="3.5" ry="5" fill="#ea580c" />
    </g>
  </g>

  <!-- Right: Typography -->
  <g transform="translate(230, 20)">
    
    <!-- "UniSphere" Wordmark -->
    <text x="0" y="68" 
          font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" 
          font-size="52" 
          font-weight="900" 
          letter-spacing="-1.5" 
          fill="#0c1e38">
      UniSphere
    </text>

    <!-- "ଓଡ଼ିଶା" Odia Regional Wordmark -->
    <text x="2" y="125" 
          font-family="'Noto Sans Oriya', 'Kalinga', 'Oriya Sangam MN', sans-serif" 
          font-size="44" 
          font-weight="900" 
          letter-spacing="0.5" 
          fill="#0c1e38">
      ଓଡ଼ିଶା
    </text>

    <!-- "Campus AI Solutions • Techinnovators" Subtitle -->
    <text x="2" y="165" 
          font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" 
          font-size="22" 
          font-weight="700" 
          letter-spacing="-0.2" 
          fill="#0c1e38">
      Campus AI Solutions • Techinnovators
    </text>

    <!-- Tagline: 'Empowering Education through AI.' -->
    <text x="2" y="195" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="13" 
          font-weight="600" 
          font-style="italic" 
          fill="#475569">
      'Empowering Education through AI.'
    </text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Circle Subtle Glow -->
    <radialGradient id="iconBgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </radialGradient>

    <!-- U-Swoosh Gradient -->
    <linearGradient id="uIconSwooshGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="45%" stop-color="#0ea5e9" />
      <stop offset="70%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Globe Gradient -->
    <radialGradient id="globeIconGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </radialGradient>

    <!-- Robot Metallic Head Gradient -->
    <linearGradient id="robotHeadIconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>

    <!-- Filter -->
    <filter id="iconDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Clean rounded backdrop -->
  <rect width="200" height="200" rx="44" fill="#ffffff" />
  
  <g filter="url(#iconDropShadow)" transform="translate(1, -2)">
    <!-- Outer Dynamic U-Shape Swoosh -->
    <path d="M 38 105 
             C 38 152, 75 178, 122 178 
             C 165 178, 192 150, 192 102 
             L 192 84 
             C 192 77, 183 75, 178 80 
             C 170 92, 164 120, 145 139 
             C 126 156, 94 156, 73 134 
             C 61 122, 56 105, 56 86 
             Z" 
          fill="url(#uIconSwooshGrad)" />

    <!-- Orange Right Wing -->
    <path d="M 164 84 
             C 176 72, 192 75, 192 84
             C 192 116, 174 144, 140 160
             C 162 144, 174 120, 174 97
             C 174 88, 169 84, 164 84 Z" 
          fill="#f97316" />

    <!-- Globe Sphere -->
    <g transform="translate(86, 68)">
      <circle cx="46" cy="46" r="42" fill="url(#globeIconGrad)" />
      
      <clipPath id="globeIconClip">
        <circle cx="46" cy="46" r="42" />
      </clipPath>

      <g clip-path="url(#globeIconClip)" stroke="#ffffff" stroke-width="2.4" fill="none" opacity="0.88">
        <line x1="4" y1="46" x2="88" y2="46" stroke-width="2.8" />
        <ellipse cx="46" cy="27" rx="38" ry="11" />
        <ellipse cx="46" cy="65" rx="38" ry="11" />
        <ellipse cx="46" cy="13" rx="28" ry="6" />
        <ellipse cx="46" cy="79" rx="28" ry="6" />

        <line x1="46" y1="4" x2="46" y2="88" stroke-width="2.8" />
        <ellipse cx="46" cy="46" rx="24" ry="42" />
        <ellipse cx="46" cy="46" rx="13" ry="42" />
      </g>
      <ellipse cx="34" cy="26" rx="18" ry="10" fill="#ffffff" opacity="0.25" transform="rotate(-25 34 26)" />
    </g>

    <!-- Robot Mascot (Left) -->
    <g transform="translate(10, 15)">
      <!-- Left Robotic Arm -->
      <path d="M 28 88 C 18 91, 12 105, 20 115 C 26 122, 35 120, 40 110 Z" fill="#ffffff" stroke="#0284c7" stroke-width="2.5" />
      <!-- Right Robotic Arm -->
      <path d="M 72 90 C 82 90, 91 97, 88 107 C 85 115, 77 116, 69 111 Z" fill="#ffffff" stroke="#0284c7" stroke-width="2.5" />

      <!-- Robot Torso -->
      <path d="M 32 80 C 32 75, 70 75, 70 80 L 66 108 C 66 119, 36 119, 36 108 Z" fill="url(#robotHeadIconGrad)" stroke="#0284c7" stroke-width="2.5" />
      <circle cx="51" cy="95" r="5.5" fill="#0284c7" />
      <circle cx="51" cy="95" r="2.5" fill="#38bdf8" />

      <!-- Ear Pods -->
      <rect x="14" y="44" width="8" height="17" rx="4" fill="#0284c7" />
      <rect x="16" y="48" width="4" height="9" rx="2" fill="#38bdf8" />
      <rect x="80" y="44" width="8" height="17" rx="4" fill="#0284c7" />
      <rect x="82" y="48" width="4" height="9" rx="2" fill="#38bdf8" />

      <!-- Head Base -->
      <rect x="20" y="30" width="62" height="50" rx="25" fill="url(#robotHeadIconGrad)" stroke="#0284c7" stroke-width="3" />

      <!-- Visor -->
      <rect x="26" y="38" width="50" height="34" rx="15" fill="#ffffff" stroke="#0284c7" stroke-width="2" />

      <!-- Eyes -->
      <ellipse cx="41" cy="51" rx="4" ry="5.5" fill="#0284c7" />
      <circle cx="42.5" cy="49" r="1.4" fill="#ffffff" />
      <ellipse cx="61" cy="51" rx="4" ry="5.5" fill="#0284c7" />
      <circle cx="62.5" cy="49" r="1.4" fill="#ffffff" />

      <!-- Smile -->
      <path d="M 44 61 Q 51 67 58 61" fill="none" stroke="#0284c7" stroke-width="2.4" stroke-linecap="round" />

      <!-- Mortarboard -->
      <ellipse cx="51" cy="32" rx="22" ry="5" fill="#0c1d36" />
      <polygon points="51,8 90,24 51,34 12,24" fill="#0f2b48" stroke="#0369a1" stroke-width="1.5" />
      <circle cx="51" cy="21" r="3" fill="#f59e0b" />
      <path d="M 51 21 C 34 23, 20 30, 17 46" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round" />
      <ellipse cx="17" cy="50" rx="3.5" ry="4.5" fill="#ea580c" />
    </g>
  </g>
</svg>
